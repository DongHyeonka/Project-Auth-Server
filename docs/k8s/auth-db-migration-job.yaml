apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-migration
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: auth-db-migration
          image: your-registry/project-auth-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: APP_PERSISTENCE_MIGRATION_RUN_ON_STARTUP
              value: "true"
            - name: APP_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-database
                  key: url
            - name: APP_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-database
                  key: username
            - name: APP_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-database
                  key: password
