name: Dev CI/CD

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  {}

env:
  JAVA_VERSION: "21"

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Run tests
        run: ./gradlew test

  publish-dev-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Ensure latest develop HEAD for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/develop

          current_sha="$(git rev-parse HEAD)"
          develop_head_sha="$(git rev-parse FETCH_HEAD)"

          if [[ "$current_sha" != "$develop_head_sha" ]]; then
            echo "Manual dev deployment is only allowed from the latest develop HEAD." >&2
            echo "Current workflow SHA: $current_sha" >&2
            echo "Latest develop SHA: $develop_head_sha" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Normalize image name
        id: image-meta
        run: |
          image_name="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/project-auth-server"
          image_tag="$(git rev-parse --short HEAD)"

          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./deploy/docker/application/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image_name }}:dev
            ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.image_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ steps.image-meta.outputs.image_tag }}
          cache-from: type=gha,scope=project-auth-server-dev-image
          cache-to: type=gha,mode=max,scope=project-auth-server-dev-image

      - name: Dispatch GitOps image update
        env:
          DISPATCH_TOKEN: ${{ secrets.GITOPS_REPO_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ steps.image-meta.outputs.image_tag }}
        run: |
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "GITOPS_REPO_DISPATCH_TOKEN is not set" >&2
            exit 1
          fi

          python3 - <<'PY' > "${RUNNER_TEMP}/gitops-dispatch.json"
          import json
          import os

          payload = {
              "event_type": "gitops-image-update",
              "client_payload": {
                  "service": "auth-server",
                  "environment": "dev",
                  "image_tag": os.environ["IMAGE_TAG"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DongHyeonka/Project-Auth-GitOps/dispatches \
            --data "@${RUNNER_TEMP}/gitops-dispatch.json"
