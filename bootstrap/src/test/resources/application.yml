spring:
  datasource:
    url: jdbc:h2:mem:project-auth-server;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/test/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/test/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/test/protocol/openid-connect/certs
            user-info-uri: http://localhost:8180/realms/test/protocol/openid-connect/userinfo
            user-name-attribute: sub
        registration:
          keycloak-google:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          keycloak-github:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

app:
  docs:
    title: Project Auth Server API Test
    description: 테스트용 OpenAPI 문서 설정입니다.
    version: test
  persistence:
    migration:
      run-on-startup: true
      location: classpath:db/migration
  security:
    jwt:
      issuer: http://localhost:8080
      active-key-id: test-rsa-key-1
      generate-key-pair-on-startup: true
      access-token-expiration: PT30M
    oauth2:
      google-registration-id: keycloak-google
      google-idp-hint: google
      github-registration-id: keycloak-github
      github-idp-hint: github
