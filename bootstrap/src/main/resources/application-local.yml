spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:h2:mem:project-auth-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${APP_DATASOURCE_USERNAME:sa}
    password: ${APP_DATASOURCE_PASSWORD:}
    driver-class-name: ${APP_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${APP_SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/project-auth}
        registration:
          keycloak-google:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID:project-auth-server}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET:project-auth-server-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          keycloak-github:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID:project-auth-server}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET:project-auth-server-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

app:
  persistence:
    migration:
      run-on-startup: ${APP_PERSISTENCE_MIGRATION_RUN_ON_STARTUP:false}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:http://localhost:8080}
      active-key-id: ${APP_SECURITY_JWT_ACTIVE_KEY_ID:local-generated-rsa-1}
      generate-key-pair-on-startup: ${APP_SECURITY_JWT_GENERATE_KEY_PAIR_ON_STARTUP:true}
      access-token-expiration: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION:PT30M}
