spring:
  application:
    name: project-auth-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
server:
  forward-headers-strategy: native

logging:
app:
  docs:
    title: ${APP_DOCS_TITLE:Project Auth Server API}
    description: ${APP_DOCS_DESCRIPTION:인증 서버의 OpenAPI 문서입니다.}
    version: ${APP_DOCS_VERSION:v1}
  logging:
    audit:
      file: ${APP_LOGGING_AUDIT_FILE:./logs/audit/auth.log}
      max-history: ${APP_LOGGING_AUDIT_MAX_HISTORY:30}
      max-file-size: ${APP_LOGGING_AUDIT_MAX_FILE_SIZE:50MB}
      total-size-cap: ${APP_LOGGING_AUDIT_TOTAL_SIZE_CAP:2GB}
    access:
      excluded-path-prefixes:
        - /actuator
        - /livez
        - /readyz
        - /swagger-ui
        - /v3/api-docs
        - /auth-login.html
        - /favicon.ico
  persistence:
    migration:
      location: ${APP_PERSISTENCE_MIGRATION_LOCATION:classpath:db/migration}
  security:
    oauth2:
      google-registration-id: ${APP_SECURITY_OAUTH2_GOOGLE_REGISTRATION_ID:keycloak-google}
      google-idp-hint: ${APP_SECURITY_OAUTH2_GOOGLE_IDP_HINT:google}
      github-registration-id: ${APP_SECURITY_OAUTH2_GITHUB_REGISTRATION_ID:keycloak-github}
      github-idp-hint: ${APP_SECURITY_OAUTH2_GITHUB_IDP_HINT:github}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
