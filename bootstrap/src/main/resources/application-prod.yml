spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${APP_DATASOURCE_URL}
    username: ${APP_DATASOURCE_USERNAME}
    password: ${APP_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${APP_SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI}
        registration:
          keycloak-google:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          keycloak-github:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

logging:
  structured:
    format:
      console: logstash

app:
  persistence:
    migration:
      run-on-startup: ${APP_PERSISTENCE_MIGRATION_RUN_ON_STARTUP:false}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER}
      active-key-id: ${APP_SECURITY_JWT_ACTIVE_KEY_ID}
      generate-key-pair-on-startup: ${APP_SECURITY_JWT_GENERATE_KEY_PAIR_ON_STARTUP:false}
      access-token-expiration: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION}
