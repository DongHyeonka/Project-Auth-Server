spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${APP_DATASOURCE_URL}
    username: ${APP_DATASOURCE_USERNAME}
    password: ${APP_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${APP_SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI}
        registration:
          keycloak-google:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          keycloak-github:
            provider: keycloak
            client-id: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID}
            client-secret: ${APP_SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

app:
  persistence:
    migration:
      run-on-startup: ${APP_PERSISTENCE_MIGRATION_RUN_ON_STARTUP:false}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER}
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-expiration: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION}
